[project]
name = "mesanote"
version = "0.1.0"
description = ""
authors = [
    { name = "V30P", email = "nhenning06@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "click>=8.3.1,<9",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
]

[project.scripts]
mesa = "mesanote.cli:cli"

[build-system]
requires = [
    "hatchling",
    "editables",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mesanote"]